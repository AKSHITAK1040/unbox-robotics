databases:
  - name: unbox-db
    databaseName: speedometer_db
    user: speeduser
    plan: free

services:
  # 1. Backend Web Service (Node.js REST API + Socket.IO Server)
  - type: web
    name: unbox-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unbox-db
          property: connectionString
      - key: PORT
        value: 10000

  # 2. Simulator Service (Autonomous 1 Hz sensor telemetry generator)
  - type: web
    name: unbox-simulator
    runtime: node
    plan: free
    rootDir: simulator
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: unbox-backend
          property: host
      - key: PORT
        value: 10000

  # 3. Frontend Static Site (React + Vite Speedometer Dashboard)
  - type: web
    name: unbox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: unbox-backend
          property: host
